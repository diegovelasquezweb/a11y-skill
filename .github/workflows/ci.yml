name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # --ignore-scripts: the package's postinstall runs `npx playwright install
      # chromium`, which fails in a clean CI install (playwright is not a direct
      # dependency). Unit tests do not need a browser, so we skip lifecycle scripts.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm test
